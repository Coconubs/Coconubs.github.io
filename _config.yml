title: Coco Cobblemon
description: Tài liệu và hướng dẫn của server Coco Cobblemon (Minecraft Java 1.21.1, Cobblemon, cộng đồng người Việt) và CocoLauncher (Coco Launcher).
url: https://coconubs.github.io
baseurl: ""
lang: vi
locale: vi_VN
author: Coconubs

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM

# Google Search Console: dán mã của thẻ google-site-verification vào dòng google bên dưới
# (chỉ phần content="..."), bỏ dấu # ở đầu 2 dòng rồi commit.
# webmaster_verifications:
#   google: MA_XAC_MINH_GOOGLE

social:
  name: Coco Cobblemon
  links:
    - https://github.com/Coconubs/coco-cobblemon
    - https://github.com/Coconubs/cocolauncher-pack
    - https://apps.microsoft.com/detail/9NPG31VS7T2H
    - https://discord.gg/hyspace

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

aux_links:
  "Discord":
    - "https://discord.gg/hyspace"
  "Microsoft Store":
    - "https://apps.microsoft.com/detail/9NPG31VS7T2H?cid=docs"
  "GitHub":
    - "https://github.com/Coconubs/coco-cobblemon"
aux_links_new_tab: true

heading_anchors: true
back_to_top: true
back_to_top_text: "Lên đầu trang / Back to top"
nav_external_links: []

callouts_level: quiet
callouts:
  note:
    title: Lưu ý
    color: blue
  tip:
    title: Mẹo
    color: green
  warning:
    title: Cảnh báo
    color: yellow
  en_note:
    title: Note
    color: blue

defaults:
  - scope:
      path: ""
    values:
      layout: default
      # Ảnh xem trước khi chia sẻ link (Facebook, Discord, Zalo): logo vuông 256x256
      image:
        path: /assets/images/coco-cobblemon-logo.png
        width: 256
        height: 256
        alt: Coco Cobblemon
      twitter:
        card: summary
  - scope:
      path: "en"
    values:
      lang: en
      locale: en_US
  # File xác minh Google Search Console: giữ nguyên file, chỉ bỏ khỏi sitemap.xml
  - scope:
      path: "google529a1e1590484e5f.html"
    values:
      sitemap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
