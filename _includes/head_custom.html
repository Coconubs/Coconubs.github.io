{%- if page.alt -%}
  {%- if page.lang == "en" %}
  <link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="vi" href="{{ page.alt | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ page.alt | absolute_url }}">
  {%- else %}
  <link rel="alternate" hreflang="vi" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="en" href="{{ page.alt | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">
  {%- endif -%}
{%- endif %}
{%- if page.jsonld %}
  <script type="application/ld+json">
{{ page.jsonld }}
  </script>
{%- endif %}
{%- if page.parent -%}
  {%- assign coco_bc_parent = site.pages | where: "title", page.parent | first -%}
  {%- if coco_bc_parent %}
  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": {{ site.title | jsonify }}, "item": {{ "/" | absolute_url | jsonify }}},
    {"@type": "ListItem", "position": 2, "name": {{ coco_bc_parent.title | jsonify }}, "item": {{ coco_bc_parent.url | absolute_url | jsonify }}},
    {"@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
  ]}
  </script>
  {%- endif -%}
{%- endif %}
